name: Firestore Restore Emulator (Synthetic Only)

on:
  pull_request:
    paths:
      - ".github/workflows/firestore-restore-emulator.yml"
      - "test/firestoreRestoreEmulator.test.mjs"
      - "test/firestore-emulator.firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Rehearse document restoration in an isolated local emulator
        run: >
          npx --yes firebase-tools@14.19.1 emulators:exec
          --only firestore
          --project demo-vocab-restore-ci
          --config test/firestore-emulator.firebase.json
          "node test/firestoreRestoreEmulator.test.mjs"
