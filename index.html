<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>vocab-app</title>

  <link rel="icon" href="vocab-app.png" />
  <link rel="apple-touch-icon" href="vocab-app.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="styles.css?v=20260905-1" />
  <link rel="stylesheet" href="landscapeControlsFix.css?v=20260825-1" />
</head>
<body class="loading">
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <button
          class="control-btn toggle-btn"
          id="toggleSidebarBtn"
          aria-label="一覧の表示切替"
          aria-pressed="false"
          aria-expanded="true"
        >
          一覧
        </button>
      </div>

      <div class="header-center">
        <div class="top-bar" aria-label="vol選択">
          <button class="vol-btn" data-vol="vol1">vol.1</button>
          <button class="vol-btn" data-vol="vol2">vol.2</button>
          <button class="vol-btn" data-vol="vol3">vol.3</button>
          <button class="vol-btn" data-vol="vol4">vol.4</button>
        </div>
        <div class="time-controls" aria-label="時間設定">
          <div class="recall-time-control" id="recallTimeControl">
            <label for="timeSlider">想起時間 <span id="timeValue">1.5</span>秒</label>
            <input id="timeSlider" type="range" min="0.5" max="10" step="0.5" value="1.5" />
          </div>
          <div class="display-time-control" id="displayTimeControl">
            <label for="displayTimeSlider">表示時間 <span id="displayTimeValue">2.0</span>秒</label>
            <input id="displayTimeSlider" type="range" min="0.5" max="10" step="0.5" value="2.0" />
          </div>
        </div>
      </div>

      <div class="feature-controls">
        <div class="feature-control-list" aria-label="学習機能">
          <button class="control-btn random-btn" id="randomBtn" type="button">乱数配列</button>
          <button class="control-btn translation-btn" id="translationBtn" type="button">訳語切替</button>
          <button class="control-btn frequency-btn" id="frequencyBtn" type="button">頻度配列</button>
          <button class="control-btn multiple-choice-btn" id="multipleChoiceBtn" type="button">四択問題</button>
          <button class="control-btn speech-sync-btn" id="speechSyncBtn" type="button">発音同期</button>
          <button class="control-btn auto-play-btn" id="autoPlayBtn" type="button">自動再生</button>
          <button class="control-btn morpheme-btn" id="morphemeBtn" type="button">語源解析</button>
          <button class="control-btn challenge-btn" id="challengeBtn" type="button">想起学習</button>
        </div>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input id="searchInput" type="search" placeholder="検索" autocomplete="off" />
      </div>
      <div class="sidebar-tools">
        <button class="control-btn favorite-list-btn" id="favoriteListBtn" type="button">☆</button>
        <button class="control-btn difficult-list-btn" id="difficultListBtn" type="button">△</button>
        <button class="control-btn reload-words-btn" id="reloadWordsBtn" type="button">単語更新</button>
        <div class="reload-words-status" id="reloadWordsStatus" aria-live="polite"></div>
      </div>
      <div id="wordList"></div>
    </aside>

    <main class="main">
      <div class="main-layout">
        <div class="center-box">
          <div class="current-meta-row">
            <span class="current-vol" id="currentVol"></span>
            <span id="progress"></span>
          </div>

          <div class="current-action-row">
            <div class="word-mark-actions">
              <button
                class="control-btn favorite-toggle-btn inline-favorite"
                id="favoriteToggleBtn"
                type="button"
                aria-label="お気に入り登録"
                title="お気に入り登録"
              >☆</button>
              <button
                class="control-btn difficult-toggle-btn inline-difficult"
                id="difficultToggleBtn"
                type="button"
                aria-label="苦手に追加"
                title="苦手に追加"
              >△</button>
            </div>
          </div>

          <div class="word-slide-card" id="wordSlideCard">
            <div id="word"></div>
            <div id="meaning"></div>
            <div class="word-detail-meta" id="wordDetailMeta"></div>
            <div id="pronunciation"></div>
            <button class="main-btn speak-btn" id="speakWordBtn" type="button">発音</button>
            <div class="multiple-choice-panel" id="multipleChoicePanel" hidden>
              <div class="multiple-choice-question" id="multipleChoiceQuestion"></div>
              <div class="multiple-choice-options" id="multipleChoiceOptions"></div>
              <div class="multiple-choice-feedback" id="multipleChoiceFeedback"></div>
            </div>
            <section class="morpheme-analysis-panel" id="morphemeAnalysisPanel" hidden></section>
          </div>

          <div class="button-row">
            <div class="nav-box">
              <div class="nav-hint" id="prevHint"></div>
              <button class="main-btn" id="prevWordBtn" type="button">前へ</button>
            </div>
            <div class="nav-box">
              <div class="help-line">← / → で移動</div>
            </div>
            <div class="nav-box">
              <div class="nav-hint" id="nextHint"></div>
              <button class="main-btn" id="nextWordBtn" type="button">次へ</button>
            </div>
          </div>
        </div>

        <div class="time-adjustments">
          <div class="time-controls" aria-label="時間設定">
            <div class="recall-time-control">
              <label for="timeSlider">想起時間 <span id="timeValueClone"></span></label>
            </div>
            <div class="display-time-control">
              <label for="displayTimeSlider">表示時間 <span id="displayTimeValueClone"></span></label>
            </div>
          </div>
        </div>

        <div class="review-adjustments">
          <div class="review-panel" aria-label="復習状態"></div>
        </div>
      </div>
    </main>

    <button class="login-btn" id="loginBtn" type="button">Googleログイン</button>
    <button class="login-btn" id="logoutBtn" type="button" hidden>ログアウト</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
